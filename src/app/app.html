<div class="app-shell">
  <header class="topbar">
    <div class="brand" aria-label="JSON Formatter">
      <span class="brand-mark" aria-hidden="true">&#123; &#125;</span>
      <span class="brand-name">json<span>formatter</span></span>
    </div>

    <nav class="topbar-nav" aria-label="Навигация">
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        Форматтер
      </a>
      <a routerLink="/viewer" routerLinkActive="active">2ГИС viewer</a>
    </nav>

    <div class="topbar-status">
      <span class="status-pulse" aria-hidden="true"></span>
      <span>локальный инструмент</span>
    </div>
  </header>

  <main class="page-content">
    <router-outlet />

    <footer class="page-footer">
      <span>Никаких запросов к серверу — данные остаются в браузере.</span>
      <span class="footer-mark">made for clean data <i>✦</i></span>
    </footer>
  </main>
</div>
